<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ISU — Family Companion</title>

  <!-- PWA & Mobile App Meta -->
  <meta name="theme-color" content="#0f6b3e" />
  <meta name="description" content="ISU — Warm family companion with AB and Samira in English, Twi, and Hausa." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./IMG_4571.JPG" />
  <link rel="apple-touch-icon" href="./IMG_4571.JPG" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ISU" />

  <style>
    :root {
      --bg: #f6f8f6;
      --surface: #ffffff;
      --surface-muted: #edf2ee;
      --primary: #0f6b3e;
      --primary-dark: #0a522f;
      --primary-soft: #e6f3ec;
      --text: #16241b;
      --text-muted: #58695e;
      --border: #dce5df;
      --shadow: 0 2px 10px rgba(15, 45, 28, 0.06);
      --radius-lg: 20px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 820px;
      margin: 0 auto;
    }

    /* Header */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.4px;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1ea861;
    }

    .status-dot.busy {
      background: #e09f1f;
    }

    .status-dot.error {
      background: #d94343;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .chip-btn:hover {
      background: var(--surface-muted);
    }

    .chip-btn.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    /* Segmented Toggles */
    .toggles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    @media (max-width: 560px) {
      .toggles-grid {
        grid-template-columns: 1fr;
      }
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface-muted);
      padding: 4px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    /* Chat Area */
    .chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .quick-prompts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .quick-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--primary-dark);
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: var(--shadow);
      text-align: left;
    }

    .quick-btn:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 84%;
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .bubble {
      padding: 13px 16px;
      border-radius: var(--radius-lg);
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-row.user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-bottom-right-radius: 6px;
    }

    .msg-row.assistant .bubble {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 6px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--surface-muted);
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      cursor: pointer;
    }

    .mini-btn.whatsapp {
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .mini-btn:hover {
      background: var(--surface-muted);
    }

    .user-label {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.82);
      margin-top: 4px;
    }

    /* Composer */
    .composer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    }

    .composer-form {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .composer-input {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      padding: 12px 16px;
      border-radius: var(--radius-pill);
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--primary);
      background: #fff;
    }

    .talk-btn {
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      padding: 12px 15px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      flex-shrink: 0;
    }

    .talk-btn.listening {
      background: #fdecec;
      border-color: #d94343;
      color: #b42318;
    }

    .send-btn {
      border: none;
      background: var(--primary);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* Install Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 28, 20, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: 22px;
      max-width: 440px;
      width: 100%;
      padding: 20px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.18);
    }

    .modal-card h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .modal-card p {
      margin: 0 0 12px;
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .install-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .install-box strong {
      display: block;
      margin-bottom: 4px;
      color: var(--primary-dark);
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
  </style>
</head>
<body>

    </header>

      <div class="quick-prompts" id="quickPrompts"></div>
    </main>
